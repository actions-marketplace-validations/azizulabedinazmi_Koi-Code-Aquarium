name: koi-code-aquarium
description: >-
  Draw a high-resolution, animated koi aquarium for a profile README: one git-koi per
  programming language in your public repositories, as a vector SVG.
branding:
  icon: droplet
  color: blue

inputs:
  user:
    description: Account to draw.
    default: ${{ github.repository_owner }}
  out:
    description: Output SVG, relative to the workspace.
    default: koi/aquarium.svg
  max-fish:
    description: Most languages to show, 1-20.
    default: "12"
  theme:
    description: '"code" (grid, code, circuits, bubbles) or "plain".'
    default: code
  wallpaper:
    description: Optional pond background image in the repository (.jpg .png .webp .gif .svg).
    default: ""
  title:
    description: Text in the terminal bar. Defaults to "<user>'s code pond".
    default: ""
  token:
    description: >-
      Token for reading public data. Keep the built-in token: it reaches only this repository,
      for this job.
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - name: Install git-koi
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        KOI_VERSION: "1.0.2"
      run: |
        case "$RUNNER_OS-$RUNNER_ARCH" in
          Linux-X64) target=x86_64-unknown-linux-musl ;;
          Linux-ARM64) target=aarch64-unknown-linux-musl ;;
          macOS-X64) target=x86_64-apple-darwin ;;
          macOS-ARM64) target=aarch64-apple-darwin ;;
          *) echo "koi-code-aquarium needs a Linux or macOS runner (use ubuntu-latest)" >&2; exit 1 ;;
        esac
        archive="git-koi-$KOI_VERSION-$target.tar.gz"
        dir="$RUNNER_TEMP/git-koi"
        mkdir -p "$dir"
        gh release download "v$KOI_VERSION" --repo yalongwastaken/git-koi --dir "$dir" \
          --pattern "$archive" --pattern "$archive.sha256"
        cd "$dir"
        if command -v sha256sum > /dev/null; then sha256sum -c "$archive.sha256"; else shasum -a 256 -c "$archive.sha256"; fi
        tar -xzf "$archive"
        echo "GIT_KOI=$dir/git-koi-$KOI_VERSION-$target/git-koi" >> "$GITHUB_ENV"

    - name: Draw the aquarium
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
        GH_TOKEN: ${{ inputs.token }}
        KOI_USER: ${{ inputs.user }}
        KOI_OUT: ${{ inputs.out }}
        KOI_MAX: ${{ inputs.max-fish }}
        KOI_THEME: ${{ inputs.theme }}
        KOI_WALLPAPER: ${{ inputs.wallpaper }}
        KOI_TITLE: ${{ inputs.title }}
      run: |
        args=(--user "$KOI_USER" --out "$KOI_OUT" --max-fish "$KOI_MAX" --theme "$KOI_THEME" --git-koi "$GIT_KOI")
        [ -n "$KOI_WALLPAPER" ] && args+=(--wallpaper "$KOI_WALLPAPER")
        [ -n "$KOI_TITLE" ] && args+=(--title "$KOI_TITLE")
        node "$GITHUB_ACTION_PATH/koi-aquarium.mjs" "${args[@]}"
