name: ✨ Feature idea
description: Suggest a new theme, option, or improvement
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: What should the aquarium do? Sketches or examples are welcome.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why would it be great?
  - type: checkboxes
    id: help
    attributes:
      label: Contributing
      options:
        - label: I'd like to build this myself
